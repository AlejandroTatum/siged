name: CI

# Run on every push and on every pull request.
on:
  push:
  pull_request:

# The Django project lives nested at siged/backend (manage.py, pytest.ini,
# requirements.txt, config/settings.py all live there), not at the repo root.
defaults:
  run:
    working-directory: siged/backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned to 3.11 to match .venv / AGENTS.md ("Backend: Python 3.11").
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: siged/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # settings.py uses django.db.backends.sqlite3 (see config/settings.py),
      # so no external database service is needed for this job.

      # Fails the build if a model was changed without a matching migration
      # (this is the exact check that would have caught a duplicate 0004_
      # migration before it reached main).
      - name: Check for missing Django migrations
        run: python manage.py makemigrations --check --dry-run

      # Test discovery/config is driven by pytest.ini in siged/backend:
      #   testpaths = apps/core apps/organizacion/tests
      #   DJANGO_SETTINGS_MODULE = config.settings
      - name: Run tests
        run: python -m pytest
